name: Set secret

# Copies a value from a GitHub environment secret into Secrets Manager, so
# nobody pastes secrets into a console. Run it after the secret exists in AWS
# (Template 1 creates the login secret; Template 2 declares app secrets in
# infra/app/aws.yaml and lists them under "appSecrets" in infra/app/config.json),
# and again whenever a value is rotated. Then re-run "Deploy", which copies
# the values into the app's namespace.
#
#   name = oidc        -> <app>/<env>/oidc          from GitHub secret OIDC_CLIENT_SECRET
#   name = DATABASE_URL -> <app>/app/<env>/DATABASE_URL from GitHub secret APP_SECRET_DATABASE_URL
#
# The GitHub secrets live on the "staging" and "production" environments, so
# each environment gets its own values.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's secret to set
        type: choice
        options: [staging, production]
      name:
        description: '"oidc" for the login secret, or an app secret name (A-Z, 0-9, _)'
        default: oidc
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  set:
    # The template repo itself has nothing to deploy; repos created from it
    # are not templates, so this only skips here.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Load config
        id: config
        env:
          GH_ENV: ${{ inputs.environment }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          CFG=infra/app/config.json
          APP=$(jq -r .appName "$CFG")
          # GitHub environment "production" is stack environment "prod".
          if [ "$GH_ENV" = production ]; then ENV_NAME=prod; else ENV_NAME=staging; fi
          if [ "$NAME" = oidc ]; then
            SECRET_ID="$APP/$ENV_NAME/oidc"
          elif [[ "$NAME" =~ ^[A-Z0-9_]+$ ]]; then
            SECRET_ID="$APP/app/$ENV_NAME/$NAME"
          else
            echo "::error::Secret name must be \"oidc\" or match ^[A-Z0-9_]+\$ (got \"$NAME\")."
            exit 1
          fi
          {
            echo "secret_id=$SECRET_ID"
            echo "region=$(jq -r .awsRegion "$CFG")"
            echo "role=arn:aws:iam::$(jq -r .awsAccountId "$CFG"):role/$APP-gh-deploy-$ENV_NAME"
          } >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Write secret
        env:
          NAME: ${{ inputs.name }}
          SECRET_ID: ${{ steps.config.outputs.secret_id }}
          # Picks the GitHub secret by name; empty if it does not exist.
          VALUE: ${{ inputs.name == 'oidc' && secrets.OIDC_CLIENT_SECRET || secrets[format('APP_SECRET_{0}', inputs.name)] }}
        run: |
          set -euo pipefail
          if [ -z "$VALUE" ]; then
            if [ "$NAME" = oidc ]; then SRC=OIDC_CLIENT_SECRET; else SRC="APP_SECRET_$NAME"; fi
            echo "::error::GitHub secret $SRC is not set on this environment."
            exit 1
          fi
          if [ "$NAME" = oidc ]; then
            # The deploy reads the client_secret key of a JSON secret.
            # jq builds it so the value is never interpolated into a string.
            STRING="$(jq -cn --arg s "$VALUE" '{client_secret: $s}')"
          else
            STRING="$VALUE"
          fi
          if ! aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$STRING" >/dev/null; then
            echo "::error::Could not write $SECRET_ID. App secrets must first be declared in infra/app/aws.yaml and deployed."
            exit 1
          fi
          echo "Updated $SECRET_ID. Re-run the Deploy workflow to apply it." >> "$GITHUB_STEP_SUMMARY"
