name: Set OIDC client secret

# Copies the identity provider's client secret from a GitHub environment
# secret into Secrets Manager (<app>/<env>/oidc), so nobody pastes it into a
# console. Run it once per environment after Template 1 exists, and again
# whenever the secret is rotated. Then re-run "Deploy" so the load balancer
# picks up the new version.
#
# GitHub setup: an environment secret OIDC_CLIENT_SECRET on "staging" and on
# "production".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's secret to set
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Load config
        id: config
        env:
          GH_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          CFG=infra/app/config.json
          APP=$(jq -r .appName "$CFG")
          # GitHub environment "production" is stack environment "prod".
          if [ "$GH_ENV" = production ]; then ENV_NAME=prod; else ENV_NAME=staging; fi
          {
            echo "secret_id=$APP/$ENV_NAME/oidc"
            echo "region=$(jq -r .awsRegion "$CFG")"
            echo "role=arn:aws:iam::$(jq -r .awsAccountId "$CFG"):role/$APP-gh-deploy-$ENV_NAME"
          } >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Write secret
        env:
          SECRET_ID: ${{ steps.config.outputs.secret_id }}
          CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_SECRET" ]; then
            echo "::error::OIDC_CLIENT_SECRET is not set on this GitHub environment."
            exit 1
          fi
          # jq builds the JSON so the value is never interpolated into a shell
          # string or echoed.
          aws secretsmanager put-secret-value --secret-id "$SECRET_ID" \
            --secret-string "$(jq -cn --arg s "$CLIENT_SECRET" '{client_secret: $s}')" >/dev/null
          echo "Updated $SECRET_ID. Re-run the Deploy workflow to apply it." >> "$GITHUB_STEP_SUMMARY"
