AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TEMPLATE 2 (part 2 of 2) - the app for one environment: ECS Fargate in
  private subnets behind a load balancer that requires company login (OIDC).
  Deployed by GitHub Actions as <app>-<env>-app. Developers own this file;
  changes here need normal code review, not Ops review.

# Baseline defaults in this file (see infra/README.md). Each one can be
# changed for a specific deployment, but say why in the pull request:
#   - No security group ingress from 0.0.0.0/0. The load balancer accepts only
#     the CIDRs in the network stack's ingress prefix list; tasks accept only
#     the load balancer.
#   - Egress to 0.0.0.0/0 is allowed on 443 only. The load balancer must reach
#     the identity provider and the tasks must reach ECR and the load
#     balancer's public signing key, and none of those have fixed IPs.
#   - Tasks get no public IP.
#   - Every IAM role created here must be named <app>-app-* and carry the
#     workload boundary from Template 1; CloudFormation refuses anything else.

Parameters:
  AppName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
  Environment:
    Type: String
    AllowedValues: [staging, prod]
  NetworkStack:
    Type: String
    Description: Name of the stack built from network.yaml, e.g. myapp-staging-network.
  ImageUri:
    Type: String
    # Digest, not tag: what staging tested is byte for byte what prod runs.
    AllowedPattern: "^.+@sha256:[a-f0-9]{64}$"
    ConstraintDescription: Must be an image reference pinned by digest (...@sha256:...).
  CpuArchitecture:
    Type: String
    AllowedValues: [ARM64, X86_64]
    # Must match the image. The pipeline builds linux/arm64.
    Default: ARM64
  TaskCpu:
    Type: String
    Default: "256"
  TaskMemory:
    Type: String
    Default: "512"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  DomainName:
    Type: String
    Default: ""
    Description: Address of this tool, e.g. mytool.staging.example.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Zone that DomainName lives in. Gets the DNS record and the certificate validation record.
  ExistingCertificateArn:
    Type: String
    Default: ""
    Description: >-
      Leave empty to have ACM issue and validate a certificate for DomainName.
      Set only to reuse a certificate that already exists (e.g. a wildcard).
  OidcIssuer:
    Type: String
  OidcAuthorizationEndpoint:
    Type: String
  OidcTokenEndpoint:
    Type: String
  OidcUserInfoEndpoint:
    Type: String
  OidcClientId:
    Type: String
    Description: >-
      Client id registered with the identity provider. Its callback URL must be
      https://<DomainName>/oauth2/idpresponse. The client secret is not a
      parameter; it is read from Secrets Manager (<app>/<env>/oidc).
  OidcSecretVersionId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9-]{32,64}$"
    Description: >-
      Current version id of <app>/<env>/oidc, looked up by the pipeline.
      CloudFormation does not notice a secret's value changing, so pinning the
      version is what makes a rotated secret reach the load balancer.

Rules:
  CertificateNeedsAZone:
    RuleCondition: !Equals [!Ref ExistingCertificateArn, ""]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref DomainName, ""]]
          - !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: >-
          Without ExistingCertificateArn, both DomainName and HostedZoneId are
          needed so ACM can issue and validate a certificate.

Conditions:
  CreateCertificate: !Equals [!Ref ExistingCertificateArn, ""]
  HasDnsRecord: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ---- certificate and DNS --------------------------------------------------

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      # With HostedZoneId set, CloudFormation writes the validation record
      # itself and waits for issuance. No manual step.
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID

  # ---- security groups ------------------------------------------------------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AppName}-${Environment} load balancer
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStack}-VpcId" }
      SecurityGroupIngress:
        # Port 80 exists only to redirect to 443.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: { "Fn::ImportValue": !Sub "${NetworkStack}-IngressPrefixListId" }
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: { "Fn::ImportValue": !Sub "${NetworkStack}-IngressPrefixListId" }
      # Declaring any egress rule removes the default allow-all.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Identity provider token and userinfo endpoints

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AppName}-${Environment} tasks, reachable only from the load balancer
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStack}-VpcId" }
      # Only the load balancer may reach the container. Anything else could
      # hit the task directly and skip login.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: ECR, CloudWatch Logs, load balancer signing key

  # Separate resource because the two groups refer to each other.
  AlbToTasks:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref TaskSecurityGroup

  # ---- load balancer --------------------------------------------------------

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # Fixed name: CfnExecRole may only manage load balancers named <app>-*.
      Name: !Sub ${AppName}-${Environment}
      Scheme: internet-facing
      Subnets: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStack}-PublicSubnetIds" }]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # Malformed headers are dropped rather than passed to the app, which
        # closes off header-smuggling tricks against the identity headers.
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: deletion_protection.enabled, Value: !If [IsProd, "true", "false"] }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStack}-VpcId" }
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      # Health checks go straight to the targets and never pass through
      # listener rules, so login cannot make them fail.
      HealthCheckPath: /api/health
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  # authenticate-oidc only works on HTTPS, which is why a certificate is
  # mandatory rather than optional.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref ExistingCertificateArn]
      DefaultActions:
        - Type: authenticate-oidc
          Order: 1
          AuthenticateOidcConfig:
            Issuer: !Ref OidcIssuer
            AuthorizationEndpoint: !Ref OidcAuthorizationEndpoint
            TokenEndpoint: !Ref OidcTokenEndpoint
            UserInfoEndpoint: !Ref OidcUserInfoEndpoint
            ClientId: !Ref OidcClientId
            # Resolved by CloudFormation at deploy time; never in this repo,
            # the parameters or the app's environment.
            ClientSecret: !Sub "{{resolve:secretsmanager:${AppName}/${Environment}/oidc:SecretString:client_secret::${OidcSecretVersionId}}}"
            Scope: openid email profile
            # A working day instead of the 7-day default.
            SessionTimeout: 28800
            OnUnauthenticatedRequest: authenticate
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref TargetGroup

  # The single unauthenticated path, for uptime checks. The app's health route
  # returns no user data.
  HealthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: [/api/health] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---- ECS ------------------------------------------------------------------

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AppName}-${Environment}
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AppName}/${Environment}
      RetentionInDays: !If [IsProd, 365, 30]

  # The app's own identity. Starts with no permissions. Add statements here
  # when the app needs S3, a secret, database auth, etc. They are capped by the
  # workload boundary, so anything outside it is denied at runtime; widening
  # the boundary itself is a Template 1 change.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      # Must start with <app>-app-; CfnExecRole may create no other roles.
      RoleName: !Sub ${AppName}-app-${Environment}-task
      PermissionsBoundary: { "Fn::ImportValue": !Sub "${AppName}-WorkloadBoundaryArn" }
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      # Example, kept commented until the app needs it:
      # Policies:
      #   - PolicyName: read-config
      #     PolicyDocument:
      #       Version: "2012-10-17"
      #       Statement:
      #         - Effect: Allow
      #           Action: ssm:GetParametersByPath
      #           Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/${Environment}/*

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-${Environment}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: { "Fn::ImportValue": !Sub "${AppName}-TaskExecutionRoleArn" }
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          # The image already runs as a non-root user (see Dockerfile).
          # Root filesystem stays writable because Next.js writes its cache to
          # .next/cache; make it read-only if your app does not.
          ReadonlyRootFilesystem: false
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            # The only load balancer whose signed identity header the app trusts.
            - { Name: ALB_SIGNER_ARN, Value: !Ref Alb }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SERVICE_NAME, Value: !Sub "${AppName}-${Environment}" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    # The target group must be attached to a listener before ECS will use it.
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub ${AppName}-${Environment}
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      # Off by default. Turning it on gives operators a shell through Session
      # Manager (no SSH); the boundary already allows the needed channel.
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${NetworkStack}-PrivateSubnetIds" }]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

Outputs:
  Url:
    Value: !If [HasDnsRecord, !Sub "https://${DomainName}", !Sub "https://${Alb.DNSName}"]
  AlbArn:
    Value: !Ref Alb
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  TaskSecurityGroupId:
    Description: Allow this group as the source in database and cache security groups.
    Value: !Ref TaskSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-TaskSecurityGroupId" }
