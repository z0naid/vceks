AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SANDBOX ONLY - a small EKS Auto Mode cluster to rehearse the EKS template
  when the company cluster is not available. Run by an admin, as stack
  sandbox-eks. Costs roughly 5-7 USD a day (control plane, NAT gateway, one
  or two small nodes, load balancers); delete the stack when done.

# Auto Mode is used because it includes everything the template expects
# from a cluster: the load balancer controller, the Pod Identity agent and
# managed nodes (IMDSv2 required, encrypted root volumes). After it is
# created, as the same admin:
#   aws eks update-kubeconfig --name <ClusterName>
#   kubectl apply -f infra/ops/k8s/cluster.yaml

Parameters:
  ClusterName:
    Type: String
    Default: sandbox
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16

Resources:
  # ---- network: two public subnets for load balancers, two private for nodes

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref ClusterName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      # Where the load balancer controller puts internet-facing ALBs.
      Tags: [{ Key: kubernetes.io/role/elb, Value: "1" }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: kubernetes.io/role/elb, Value: "1" }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: kubernetes.io/role/internal-elb, Value: "1" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      Tags: [{ Key: kubernetes.io/role/internal-elb, Value: "1" }]

  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRoutes }

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRoutes }

  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: { Domain: vpc }

  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatAddress.AllocationId

  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRoutes
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRoutes }

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRoutes }

  # Baseline: deny SSH and RDP from anywhere at the subnet edge.
  Nacl:
    Type: AWS::EC2::NetworkAcl
    Properties: { VpcId: !Ref Vpc }

  NaclDenySsh:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref Nacl
      RuleNumber: 10
      Protocol: 6
      RuleAction: deny
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 22, To: 22 }

  NaclDenyRdp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref Nacl
      RuleNumber: 20
      Protocol: 6
      RuleAction: deny
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 3389, To: 3389 }

  # NACLs are stateless; security groups do the real filtering.
  NaclAllowIn:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref Nacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0

  NaclAllowOut:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref Nacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  NaclPublicA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref Nacl }

  NaclPublicB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref Nacl }

  NaclPrivateA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, NetworkAclId: !Ref Nacl }

  NaclPrivateB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, NetworkAclId: !Ref Nacl }

  # ---- cluster ---------------------------------------------------------------

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ClusterName}-eks-cluster
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSComputePolicy
        - arn:aws:iam::aws:policy/AmazonEKSBlockStoragePolicy
        - arn:aws:iam::aws:policy/AmazonEKSLoadBalancingPolicy
        - arn:aws:iam::aws:policy/AmazonEKSNetworkingPolicy

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ClusterName}-eks-node
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodeMinimalPolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      RoleArn: !GetAtt ClusterRole.Arn
      # Access entries only (no aws-auth ConfigMap), which is what lets a
      # tool's deploy role be limited to one namespace. The admin who
      # creates this stack gets cluster-admin to finish the setup.
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true
      # Auto Mode.
      BootstrapSelfManagedAddons: false
      ComputeConfig:
        Enabled: true
        NodePools: [general-purpose, system]
        NodeRoleArn: !GetAtt NodeRole.Arn
      KubernetesNetworkConfig:
        ElasticLoadBalancing: { Enabled: true }
      StorageConfig:
        BlockStorage: { Enabled: true }
      ResourcesVpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        EndpointPrivateAccess: true
        # GitHub-hosted runners deploy over the public endpoint. A company
        # cluster would restrict this with PublicAccessCidrs or use
        # self-hosted runners inside the VPC.
        EndpointPublicAccess: true

Outputs:
  ClusterName:
    Value: !Ref Cluster
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  ClusterSecurityGroupId:
    Description: The security group Auto Mode nodes and pods use; the client group for examples/.
    Value: !GetAtt Cluster.ClusterSecurityGroupId
